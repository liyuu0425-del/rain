# 双路降雨测量系统配置
#
# 这个文件集中所有参数。代码里不写死任何阈值、路径或魔法数字，
# 全部从这里读。换算法、调参数都只改这个文件，不动代码。

# ============================================================================
# 数据路径
# ============================================================================
data:
  # 双路图像目录
  dir_a: D:\毕设\数据\cama
  dir_b: D:\毕设\数据\camb
  # 背景参考目录（可选）
  bg_ref_a: D:\毕设\数据\bja\Background_Ref_20260727_230651
  bg_ref_b: D:\毕设\数据\bjb\Background_Ref_20260727_230651
  # 结果输出目录
  output_dir: D:\Codex\毕设相关\rain\results

# ============================================================================
# 读取器
# ============================================================================
reader:
  name: lzw_tif                      # lzw_tif | raw_bin
  params:
    expect_shape: [1544, 2064]       # [H, W] 校验尺寸，写 null 则不校验

# ============================================================================
# 背景模型
# ============================================================================
background:
  name: batch_quantile               # batch_quantile | external_ref
  params:
    q: 0.5                           # 分位数，0.5=中位数
    max_frames: 32                   # 最多用多少帧参与合成

# 如果要用外部背景参考，改成这样：
# background:
#   name: external_ref
#   params:
#     ref_dir: D:\毕设\数据\bja\Background_Ref_20260727_230651
#     reader_cfg: {name: lzw_tif}
#     q: 0.5
#     max_frames: 32

# ============================================================================
# 检测器
# ============================================================================
detector:
  name: simple_threshold             # simple_threshold | adaptive | ccl
  params:
    thresh: 20                       # 差值阈值（灰阶）
    open_ksize: 3                    # 形态学开运算核尺寸
    min_area: 10.0                   # 最小面积（像素），粗筛
    max_area: 5000.0                 # 最大面积（像素）
    max_aspect: 3.5                  # 最大长宽比

# ============================================================================
# 跟踪器
#
# nn_gate      : 圆形门控最近邻。简单，但对下落雨滴不合适（见下）。
# gravity_gate : 各向异性 + 单向门控。默认。
#
# 实测对比（cama/Capture_20260727_232420，180 帧，1309 个检测）：
#   nn_gate  40px : 轨迹 38  平均5.2帧  用掉检测15%   dy标准差0.7  |dx|4.7
#   nn_gate 200px : 轨迹182  平均7.0帧  用掉检测97%   dy标准差1.4  |dx|10.5  <- 接错
#   gravity_gate  : 轨迹116  平均9.7帧  用掉检测86%   dy标准差0.9  |dx|5.4   <- 最优
#
# 下面的参数来自这一批数据的实测分布，是经验值，不是最终参数。
# 必须用人工标注验证集标定，并在不同雨强下复核。
# ============================================================================
tracker:
  name: gravity_gate                 # gravity_gate | nn_gate
  params:
    dy_min: 15.0                     # 帧间垂直位移下限（像素，向下为正）
    dy_max: 170.0                    # 上限。实测主峰 20-140
    dx_max: 20.0                     # 水平位移绝对值上限
                                     # 权衡实测(90帧): 45->倾斜轨迹16%  30->13%
                                     #                20->8%(默认)  12->5%  8->0%
                                     # 放松则误连,收紧则丢真轨迹,必须用标注数据定
    cost_dx_weight: 3.0              # 代价函数里横向偏移的权重
    max_gap: 0                       # 允许中断几帧后续上
    min_track_len: 2                 # 短于此长度的轨迹丢弃

# ============================================================================
# 双路匹配器（当前占位）
# ============================================================================
stereo:
  name: placeholder                  # 占位，标定完成后填
  params: {}

# ============================================================================
# 并发控制
# ============================================================================
concurrency:
  max_workers: 6                     # 线程池大小，建议=CPU核数
  queue_size: 4                      # 在线runner的有界队列长度（批次数）

# ============================================================================
# 调试与输出
# ============================================================================
debug:
  save_overlay: true                 # 保存检测叠加图
  save_intermediate: false           # 保存中间图（diff / binary）
  overlay_samples: 10                # 每批保存几帧叠加图
