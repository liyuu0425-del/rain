[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rain-detection"
version = "0.1.0"
description = "双路图像降雨检测与轨迹分析"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.7",
    "PyYAML>=6.0",
    "matplotlib>=3.5",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["rain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
